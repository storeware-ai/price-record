name: Keep the tree heads
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the heads kept so far
        run: |
          git fetch origin heads || true
          if git rev-parse --verify origin/heads >/dev/null 2>&1; then
            git worktree add kept origin/heads
          else
            git worktree add --orphan -b heads kept
          fi
      - name: Keep the newest head, refusing a rewrite
        env:
          PRICE_RECORD_HEADS: kept/heads
        run: node watch.mjs
      - name: Commit it
        working-directory: kept
        run: |
          git config user.name 'price record watch'
          git config user.email 'actions@users.noreply.github.com'
          git add heads
          git diff --cached --quiet || git commit -m 'Keep the newest tree head'
          git push origin HEAD:heads
